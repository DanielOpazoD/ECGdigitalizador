[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecg-photo"
version = "0.1.0"
description = "ECG Foto a Senal: digitize photographed ECGs into calibrated signals"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "pydantic",
    "wfdb",
    "matplotlib",
    "pyyaml",
    "pypdf",
    "pypdfium2==5.13.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx==0.28.1",
]

[project.scripts]
ecg-photo = "ecg_photo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_photo"]
artifacts = ["src/ecg_photo/ui/*.html"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
