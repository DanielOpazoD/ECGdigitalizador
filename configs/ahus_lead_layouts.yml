# Ahus layout set used by ecg-photo (F8, objective O8 in docs/mission.md).
# = the three 3x4 layouts of Ahus src/config/lead_layouts_george-moody-2024.yml
#   (explicit II rhythm strip; their wildcard-rhythm variants in
#   lead_layouts_all.yml degraded real Kaggle 3x4 images, mainly aVF)
# + standard_6x2 copied from Ahus src/config/lead_layouts_all.yml.
# Evaluation: docs/evaluation.md, "F8".

3x4+1R:
  description: "3×4 standard layout with lead II as rhythm lead"
  layout:
    rows: 3
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
    - ["II", "II", "II", "II"]
  rhythm_leads: []
  total_rows: 4

6x4:
  description: "3×4 standard layout with 3 rhythm leads"
  layout:
    rows: 6
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
    - ["V1", "V1", "V1", "V1"]
    - ["II", "II", "II", "II"]
    - ["V5", "V5", "V5", "V5"]
  rhythm_leads: []
  total_rows: 6

3x4+3R:
  description: "3×4 standard layout with 3 wildcard rhythm leads"
  layout:
    rows: 3
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
  total_rows: 6

standard_6x2:
  description: "6×2 standard layout"
  layout:
    rows: 6
    cols: 2
  leads:
    - ["I", "V1"]
    - ["II", "V2"]
    - ["III", "V3"]
    - ["aVR", "V4"]
    - ["aVL", "V5"]
    - ["aVF", "V6"]
  rhythm_leads: []
  total_rows: 6

